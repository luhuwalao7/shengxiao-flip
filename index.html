<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生肖翻牌</title>
<style>
/* ==== app.wxss ==== */
/* 全局样式：深色底 + 柔和光晕 */
html,
body {
  min-height: 100%;
  background-color: #0b0918;
  background-image:
    radial-gradient(circle at 12% -4%, rgba(124, 92, 255, 0.42) 0%, rgba(124, 92, 255, 0) 52%),
    radial-gradient(circle at 92% 4%, rgba(74, 214, 255, 0.16) 0%, rgba(74, 214, 255, 0) 44%),
    linear-gradient(180deg, #16122f 0%, #0c0a1c 60%, #090713 100%);
  background-repeat: no-repeat;
  color: #f4f1ff;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

div,
span {
  box-sizing: border-box;
}

.page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 12px 15px 12px;
  padding-bottom: calc(12px + constant(safe-area-inset-bottom));
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}

/* 背景音乐开关（首页 / 对局页共用） */
.sound {
  position: relative;
  width: 30px;
  height: 30px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  border: 0.5px solid rgba(255, 255, 255, 0.12);
  transition: background 0.16s ease;
}

.sound-hover {
  background: rgba(255, 255, 255, 0.16);
}

.sound-icon {
  font-size: 14px;
  line-height: 1;
  color: #cfc9ee;
}

.sound.is-off .sound-icon {
  opacity: 0.35;
}

.sound.is-off::after {
  content: '';
  position: absolute;
  width: 17px;
  height: 1px;
  border-radius: 1px;
  background: #cfc9ee;
  transform: rotate(-45deg);
}


/* ==== pages/index/index.wxss ==== */
.index {
  justify-content: flex-start;
}

/* ---------- 顶部标题区 ---------- */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 0 22px;
}

.logo {
  width: 68px;
  height: 68px;
  border-radius: 21px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #8b6bff 0%, #5b7bff 55%, #3f9bff 100%);
  box-shadow: 0 10px 22px rgba(88, 70, 255, 0.38),
    inset 0 1px 0 rgba(255, 255, 255, 0.45);
  margin-bottom: 14px;
}

.logo-emoji {
  font-size: 34px;
  line-height: 1;
}

.title {
  font-size: 29px;
  font-weight: 700;
  letter-spacing: 3px;
}

.subtitle {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 8px;
}

.subtitle-line {
  font-size: 12px;
  line-height: 1.7;
  color: #9c94c8;
}

/* ---------- 难度列表 ---------- */
.levels {
  display: flex;
  flex-direction: column;
  margin-top: 4px;
}

.level {
  display: flex;
  align-items: center;
  padding: 13px 12px;
  margin-bottom: 9px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.055);
  border: 0.5px solid rgba(255, 255, 255, 0.09);
  transition: transform 0.16s ease, background 0.16s ease;
}

.level:last-child {
  margin-bottom: 0;
}

.level-hover {
  background: rgba(255, 255, 255, 0.11);
  transform: scale(0.985);
}

.level-icon {
  width: 44px;
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 11px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.08);
  border: 0.5px solid rgba(255, 255, 255, 0.08);
}

.level-icon-emoji {
  font-size: 20px;
  line-height: 1;
}

.level-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.level-head {
  display: flex;
  align-items: center;
}

.level-name {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.level-tag {
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 499.5px;
  font-size: 10px;
  color: #c0b2ff;
  background: rgba(124, 92, 255, 0.22);
}

.level-meta {
  margin-top: 4px;
  font-size: 11.5px;
  color: #8d85b9;
}

.level-best {
  margin-top: 3px;
  font-size: 10.5px;
  color: #55dfb0;
}

.level-arrow {
  margin-left: 6px;
  font-size: 21px;
  color: #6a6299;
  line-height: 1;
}

/* ---------- 底部说明 ---------- */
.foot {
  margin-top: auto;
  padding-top: 16px;
  display: flex;
  flex-direction: column;
}

.zodiac {
  padding: 10px 11px 8px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.035);
  border: 0.5px solid rgba(255, 255, 255, 0.07);
}

.zodiac-title {
  font-size: 9.5px;
  color: #6b6396;
  letter-spacing: 1px;
}

.zodiac-list {
  display: flex;
  flex-wrap: wrap;
  margin-top: 5px;
}

.zodiac-item {
  width: 16.66%;
  text-align: center;
  font-size: 16px;
  line-height: 1.6;
}

.foot-row {
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.foot-text {
  font-size: 10px;
  color: #5f5888;
}


/* ==== pages/game/game.wxss ==== */
.game {
  padding: 8px 12px 8px;
  padding-bottom: calc(8px + constant(safe-area-inset-bottom));
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  overflow: hidden;
}

/* ---------- 顶部数据条 ---------- */
.hud {
  display: flex;
  align-items: center;
  padding: 4px 4px 12px;
}

.stats {
  flex: 1;
  display: flex;
}

.stat {
  display: flex;
  flex-direction: column;
  margin-right: 17px;
}

.stat-value {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
}

.stat-label {
  margin-top: 2px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #8a82b8;
}

.controls {
  display: flex;
  align-items: center;
}

.restart {
  display: flex;
  align-items: center;
  margin-left: 7px;
  padding: 6px 11px;
  border-radius: 499.5px;
  background: rgba(255, 255, 255, 0.07);
  border: 0.5px solid rgba(255, 255, 255, 0.1);
  transition: background 0.16s ease;
}

.restart-hover {
  background: rgba(255, 255, 255, 0.16);
}

.restart-icon {
  margin-right: 3px;
  font-size: 14px;
  color: #c9c2ee;
  line-height: 1;
}

.restart-text {
  font-size: 12px;
  color: #c9c2ee;
}

/* ---------- 牌桌 ---------- */
.board {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: 7px;
  justify-content: center;
  align-content: center;
}

.card {
  position: relative;
  perspective: 600px;
  transition: transform 0.18s ease;
}

.card-hover {
  transform: scale(0.96);
}

.card-inner {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  transition: transform 0.46s cubic-bezier(0.2, 0.8, 0.35, 1);
}

.card.is-flipped .card-inner {
  -webkit-transform: rotateY(180deg);
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 11px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

/* 卡背 */
.face-back {
  background: linear-gradient(150deg, #7b5cff 0%, #5a6bff 52%, #3f8bff 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4),
    0 5px 11px rgba(44, 34, 116, 0.38);
}

.face-back::after {
  content: '';
  position: absolute;
  top: 9%;
  left: 9%;
  width: 82%;
  height: 82%;
  border-radius: 8px;
  border: 0.5px solid rgba(255, 255, 255, 0.24);
}

.back-mark {
  font-size: 15px;
  color: rgba(255, 255, 255, 0.92);
  font-size: 6.6vmin;
  line-height: 1;
}

/* 卡面 */
.face-front {
  flex-direction: column;
  background: linear-gradient(160deg, #fffdf7 0%, #ffeacf 100%);
  box-shadow: 0 5px 11px rgba(0, 0, 0, 0.26);
  -webkit-transform: rotateY(180deg);
  transform: rotateY(180deg);
}

.face-emoji {
  font-size: 31px;
  font-size: 8vmin;
  line-height: 1;
}

.face-name {
  margin-top: 4px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #a5814f;
}

.card.is-matched .face-name {
  color: #2f7a5f;
}

/* 配对成功 */
.card.is-matched {
  transform: scale(0.965);
}

.card.is-matched .face-front {
  background: linear-gradient(160deg, #e4fff4 0%, #a9f7d8 100%);
  box-shadow: 0 0 0 1.5px rgba(61, 220, 151, 0.55),
    0 6px 13px rgba(22, 160, 110, 0.28);
}

.card.is-matched .face-emoji {
  opacity: 0.88;
}

/* 配对失败抖动 */
.card.is-wrong {
  animation: card-shake 0.4s ease;
}

@keyframes card-shake {
  0%,
  100% {
    transform: translateX(0);
  }
  18% {
    transform: translateX(-3.5px) rotate(-1.4deg);
  }
  42% {
    transform: translateX(3.5px) rotate(1.4deg);
  }
  68% {
    transform: translateX(-2px);
  }
  86% {
    transform: translateX(1.5px);
  }
}

/* ---------- 底部信息 ---------- */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px 2px;
}

.footer-hint {
  font-size: 10px;
  color: #615a8b;
  letter-spacing: 0.5px;
}

.footer-best {
  font-size: 10px;
  color: #4fbf98;
  letter-spacing: 0.5px;
}

/* ---------- 结算浮层 ---------- */
.result-mask {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 28px;
  background: rgba(7, 5, 18, 0.64);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.28s ease;
}

.result-mask.is-show {
  opacity: 1;
  visibility: visible;
}

.result-card {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 26px 20px 20px;
  border-radius: 20px;
  background: linear-gradient(165deg, #29224f 0%, #171331 100%);
  border: 0.5px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
  transform: translateY(14px) scale(0.96);
  transition: transform 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.08);
}

.result-mask.is-show .result-card {
  transform: translateY(0) scale(1);
}

.result-emoji {
  font-size: 38px;
  line-height: 1;
}

.result-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
}

.result-sub {
  margin-top: 5px;
  font-size: 11px;
  color: #9a92c6;
}

.result-stats {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-top: 17px;
  padding: 13px 0;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.05);
  border: 0.5px solid rgba(255, 255, 255, 0.07);
}

.result-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.rs-value {
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.rs-label {
  margin-top: 3px;
  font-size: 10px;
  color: #8a82b8;
}

.rs-divider {
  width: 0.5px;
  height: 28px;
  background: rgba(255, 255, 255, 0.1);
}

.result-best {
  margin-top: 11px;
  font-size: 10.5px;
  color: #55dfb0;
}

.result-actions {
  display: flex;
  width: 100%;
  margin-top: 19px;
}

.btn {
  flex: 1;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 499.5px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.btn-ghost {
  margin-right: 10px;
  color: #cfc9ee;
  background: rgba(255, 255, 255, 0.08);
  border: 0.5px solid rgba(255, 255, 255, 0.14);
}

.btn-primary {
  color: #ffffff;
  background: linear-gradient(135deg, #7c5cff 0%, #3f7bff 100%);
  box-shadow: 0 7px 15px rgba(80, 70, 255, 0.38);
}

.btn-hover {
  opacity: 0.82;
}

</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; }
  #app { position: relative; width: 100%; height: 100%; }

  .screen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; padding-top: 44px; }
  .screen.active { display: block; }
  .screen .page { min-height: calc(100vh - 44px); }

  /* 模拟微信原生导航栏 */
  .navbar {
    position: absolute; left: 0; top: 0; width: 100%; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: #16122f; color: #fff; font-size: 17px; font-weight: 500;
    letter-spacing: .5px; z-index: 5;
  }
  .navbar .back {
    position: absolute; left: 12px; top: 0; height: 44px; line-height: 42px;
    font-size: 26px; color: #fff; opacity: .9; cursor: pointer;
  }
</style>
</head>
<body>
<!-- 生肖翻牌 · 单文件版：无外部依赖，双击即可在浏览器里玩。音乐由脚本生成，无版权问题。 -->
<div id="__err" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 14px;background:#b3261e;color:#fff;font:13px/1.6 monospace;white-space:pre-wrap"></div>
<noscript><div style="padding:16px;color:#fff;font:14px/1.6 sans-serif">需要开启 JavaScript 才能玩这个游戏。</div></noscript>
<script>(function(){function show(msg){var b=document.getElementById("__err");if(!b){b=document.createElement("div");b.id="__err";document.body.appendChild(b);}b.style.cssText="display:block;position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 14px;background:#b3261e;color:#fff;font:13px/1.6 monospace;white-space:pre-wrap";b.textContent="页面脚本出错，请用 Chrome / Edge 打开：\n"+msg;}window.addEventListener("error",function(e){show((e.message||e.error||"unknown")+(e.lineno?"  (行 "+e.lineno+")":""));},true);})();</script>

<div id="app">

  <!-- ========== 首页 ========== -->
  <section class="screen" id="screen-index">
    <div class="navbar">生肖翻牌</div>
    <div class="page index">
      <div class="hero">
        <div class="logo"><span class="logo-emoji">🧠</span></div>
        <span class="title">生肖翻牌</span>
        <div class="subtitle">
          <span class="subtitle-line">翻开两张相同的生肖卡凑成一对</span>
          <span class="subtitle-line">用最少的步数把它们全部配对</span>
        </div>
      </div>
      <div class="levels" id="levelList"></div>
      <div class="foot">
        <div class="zodiac">
          <span class="zodiac-title">十二生肖 · 牌面一览</span>
          <div class="zodiac-list" id="zodiacList"></div>
        </div>
        <div class="foot-row">
          <span class="foot-text">每次开局随机 · 成绩保存在本机</span>
          <div class="sound" id="soundIndex"><span class="sound-icon">♫</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 游戏页 ========== -->
  <section class="screen" id="screen-game">
    <div class="navbar"><span class="back" id="navBack">‹</span><span id="navTitle">生肖翻牌 · 标准</span></div>
    <div class="page game">
      <div class="hud">
        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="moves">0</span>
            <span class="stat-label">步数</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="timeText">00:00</span>
            <span class="stat-label">用时</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="pairs">0/8</span>
            <span class="stat-label">配对</span>
          </div>
        </div>
        <div class="controls">
          <div class="sound" id="soundGame"><span class="sound-icon">♫</span></div>
          <div class="restart" id="restart">
            <span class="restart-icon">↻</span>
            <span class="restart-text">重开</span>
          </div>
        </div>
      </div>

      <div class="board" id="board"></div>

      <div class="footer">
        <span class="footer-hint" id="footerHint">翻开两张相同的牌即可配对</span>
        <span class="footer-best" id="footerBest">最佳 暂无记录</span>
      </div>

      <div class="result-mask" id="resultMask">
        <div class="result-card">
          <span class="result-emoji" id="resultEmoji">🧠</span>
          <span class="result-title" id="resultTitle">通关啦</span>
          <span class="result-sub" id="resultSub">标准难度 · 全部配对完成</span>
          <div class="result-stats">
            <div class="result-stat">
              <span class="rs-value" id="resultMoves">0</span>
              <span class="rs-label">步数</span>
            </div>
            <div class="rs-divider"></div>
            <div class="result-stat">
              <span class="rs-value" id="resultTime">00:00</span>
              <span class="rs-label">用时</span>
            </div>
          </div>
          <span class="result-best" id="resultBest">最佳纪录 暂无记录</span>
          <div class="result-actions">
            <div class="btn btn-ghost" id="btnBack">换个难度</div>
            <div class="btn btn-primary" id="btnAgain">再来一局</div>
          </div>
        </div>
      </div>
    </div>

<script>
/**
 * 生肖翻牌 · 纯逻辑模块
 * 这里不调用任何 wx API，方便直接放在 Node 里做单元测试。
 */

// 十二生肖卡面（emoji + 传统称谓），想换主题时只改这里即可
const ZODIAC = [
  { emoji: '🐭', name: '子鼠' },
  { emoji: '🐮', name: '丑牛' },
  { emoji: '🐯', name: '寅虎' },
  { emoji: '🐰', name: '卯兔' },
  { emoji: '🐲', name: '辰龙' },
  { emoji: '🐍', name: '巳蛇' },
  { emoji: '🐴', name: '午马' },
  { emoji: '🐐', name: '未羊' },
  { emoji: '🐵', name: '申猴' },
  { emoji: '🐔', name: '酉鸡' },
  { emoji: '🐶', name: '戌狗' },
  { emoji: '🐷', name: '亥猪' }
];

const FACE_POOL = ZODIAC.map((item) => item.emoji);

// 四个难度：卡片总数 = cols * rows = pairs * 2
const LEVELS = {
  easy: { key: 'easy', name: '轻松', cols: 3, rows: 4, pairs: 6, grid: '3 × 4' },
  normal: { key: 'normal', name: '标准', cols: 4, rows: 4, pairs: 8, grid: '4 × 4' },
  hard: { key: 'hard', name: '进阶', cols: 4, rows: 5, pairs: 10, grid: '4 × 5' },
  expert: { key: 'expert', name: '极限', cols: 4, rows: 6, pairs: 12, grid: '4 × 6' }
};

const LEVEL_ORDER = ['easy', 'normal', 'hard', 'expert'];

/**
 * Fisher-Yates 洗牌，返回新数组，不修改入参
 * @param {Array} list
 * @param {Function} [random] 便于测试时传入固定随机源
 */
function shuffle(list, random) {
  const rand = typeof random === 'function' ? random : Math.random;
  const arr = list.slice();
  for (let i = arr.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rand() * (i + 1));
    const tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

/**
 * 生成一副牌：从十二生肖里抽 pairs 个，每个两张，顺序打乱
 * @param {string} levelKey
 * @param {Function} [random]
 * @returns {Array<{id:number, pairId:number, face:string, name:string, flipped:boolean, matched:boolean}>}
 */
function buildDeck(levelKey, random) {
  const rand = typeof random === 'function' ? random : Math.random;
  const level = LEVELS[levelKey] || LEVELS.normal;
  const picked = shuffle(ZODIAC, rand).slice(0, level.pairs);
  const deck = [];

  for (let i = 0; i < picked.length; i += 1) {
    const zodiac = picked[i];
    deck.push({
      id: i * 2,
      pairId: i,
      face: zodiac.emoji,
      name: zodiac.name,
      flipped: false,
      matched: false
    });
    deck.push({
      id: i * 2 + 1,
      pairId: i,
      face: zodiac.emoji,
      name: zodiac.name,
      flipped: false,
      matched: false
    });
  }

  return shuffle(deck, rand);
}

function pad2(n) {
  return n < 10 ? '0' + n : '' + n;
}

/**
 * 毫秒 -> mm:ss
 */
function formatTime(ms) {
  const total = Math.max(0, Math.floor((ms || 0) / 1000));
  return pad2(Math.floor(total / 60)) + ':' + pad2(total % 60);
}

/**
 * 成绩记录 -> “12 步 · 00:38”
 */
function formatRecord(record) {
  if (!record) return '暂无记录';
  return record.moves + ' 步 · ' + formatTime(record.time);
}

/**
 * 先比步数，步数相同再比用时
 */
function isBetterRecord(prev, next) {
  if (!next) return false;
  if (!prev) return true;
  if (next.moves !== prev.moves) return next.moves < prev.moves;
  return next.time < prev.time;
}

module.exports = {
  ZODIAC,
  FACE_POOL,
  LEVELS,
  LEVEL_ORDER,
  shuffle,
  buildDeck,
  formatTime,
  formatRecord,
  isBetterRecord
};

<script>
/* 浏览器预览版：复刻小程序里的交互，便于在网页里试玩 / 截图。
   仅用于预览，小程序本体在 pages/ + utils/ 中。 */
(function () {
  'use strict';

  var G = window.module.exports;
  var params = new URLSearchParams(window.location.search);
  var screen = params.get('screen') || 'index';
  var levelKey = G.LEVELS[params.get('level')] ? params.get('level') : 'normal';
  var mode = params.get('mode') || 'play';

  // 便捷入口：?s=index / ?s=game-mid / ?s=result（方便截图和分享链接）
  var shortcut = params.get('s');
  if (shortcut === 'index') {
    screen = 'index';
  } else if (shortcut === 'game-mid') {
    screen = 'game';
    mode = 'mid';
  } else if (shortcut === 'result') {
    screen = 'game';
    mode = 'result';
  }

  var LEVEL_STYLE = {
    easy: { emoji: '🌱', tag: '入门' },
    normal: { emoji: '⭐', tag: '推荐' },
    hard: { emoji: '🔥', tag: '挑战' },
    expert: { emoji: '👑', tag: '高手' }
  };

  // 预览用的示例成绩（小程序里读的是真实本地存储）
  var DEMO_BEST = {
    easy: { moves: 11, time: 41000 },
    normal: { moves: 16, time: 62000 },
    hard: { moves: 24, time: 118000 },
    expert: null
  };

  var $ = function (id) {
    return document.getElementById(id);
  };

  var currentScreen = 'index';

  function showScreen(name) {
    currentScreen = name === 'index' ? 'index' : 'game';
    document.getElementById('screen-index').classList.toggle('active', currentScreen === 'index');
    document.getElementById('screen-game').classList.toggle('active', currentScreen === 'game');
    if (currentScreen === 'game') layoutBoard();
  }

  function openGame(key) {
    showScreen('game');
    startGame(key);
  }

  /* ---------------- 首页 ---------------- */

  function renderLevels() {
    var list = $('levelList');
    list.innerHTML = '';

    G.LEVEL_ORDER.forEach(function (key) {
      var level = G.LEVELS[key];
      var style = LEVEL_STYLE[key];
      var best = DEMO_BEST[key];
      var el = document.createElement('div');
      el.className = 'level';
      el.innerHTML =
        '<div class="level-icon"><span class="level-icon-emoji">' + style.emoji + '</span></div>' +
        '<div class="level-main">' +
        '<div class="level-head"><span class="level-name">' + level.name + '</span>' +
        '<span class="level-tag">' + style.tag + '</span></div>' +
        '<span class="level-meta">' + level.grid + ' · ' + level.pairs + ' 种生肖</span>' +
        '<span class="level-best">' + (best ? '最佳 ' + G.formatRecord(best) : '暂无记录') + '</span>' +
        '</div>' +
        '<span class="level-arrow">›</span>';
      el.addEventListener('click', function () {
        openGame(key);
      });
      list.appendChild(el);
    });
  }

  function renderZodiac() {
    var list = $('zodiacList');
    if (!list) return;
    list.innerHTML = G.ZODIAC.map(function (z) {
      return '<span class="zodiac-item">' + z.emoji + '</span>';
    }).join('');
  }

  /* ---------------- 游戏 ---------------- */

  var S = {
    cards: [],
    moves: 0,
    matched: 0,
    first: -1,
    locked: false,
    finished: false,
    started: false,
    elapsed: 0,
    startAt: 0,
    timer: null,
    level: 'normal'
  };

  function readBest(key) {
    try {
      var all = JSON.parse(window.localStorage.getItem('memory_preview_best') || '{}');
      return all[key] || null;
    } catch (e) {
      return null;
    }
  }

  function writeBest(key, record) {
    try {
      var all = JSON.parse(window.localStorage.getItem('memory_preview_best') || '{}');
      all[key] = record;
      window.localStorage.setItem('memory_preview_best', JSON.stringify(all));
    } catch (e) {
      /* ignore */
    }
  }

  function stopTimer() {
    if (S.timer) {
      clearInterval(S.timer);
      S.timer = null;
    }
  }

  function updateHud() {
    $('moves').textContent = S.moves;
    $('pairs').textContent = S.matched + '/' + (S.cards.length / 2);
    updateFooter();
  }

  function fmtBest(key) {
    var record = readBest(key) || DEMO_BEST[key];
    return record ? '最佳 ' + G.formatRecord(record) : '最佳 暂无记录';
  }

  function updateFooter() {
    var level = G.LEVELS[S.level];
    var hint = '翻开两张相同的生肖卡即可配对';
    if (S.finished) hint = '全部配对完成';
    else if (S.moves > 0) hint = level.name + ' · ' + level.cols + ' × ' + level.rows;
    $('footerHint').textContent = hint;
    $('footerBest').textContent = fmtBest(S.level);
  }

  // 与小程序 pages/game/game.js 里的 layoutBoard 保持一致
  function layoutBoard() {
    var board = $('board');
    var level = G.LEVELS[S.level];
    var rect = board.getBoundingClientRect();
    var rpx = window.innerWidth / 750;
    var gap = 14 * rpx;
    var availW = rect.width - (level.cols - 1) * gap;
    var availH = rect.height - (level.rows - 1) * gap;
    if (availW <= 0 || availH <= 0) return;

    var w = availW / level.cols;
    var h = availH / level.rows;
    var ratio = 0.66;
    if (w / h > ratio) w = h * ratio;
    else h = w / ratio;

    board.style.gridTemplateColumns = 'repeat(' + level.cols + ', ' + Math.floor(w) + 'px)';
    board.style.gridTemplateRows = 'repeat(' + level.rows + ', ' + Math.floor(h) + 'px)';
  }

  function startGame(key) {
    var level = G.LEVELS[key];
    stopTimer();
    S.cards = [];
    S.moves = 0;
    S.matched = 0;
    S.first = -1;
    S.locked = false;
    S.finished = false;
    S.started = false;
    S.elapsed = 0;
    S.startAt = 0;
    S.level = key;

    $('timeText').textContent = '00:00';
    $('resultMask').classList.remove('is-show');
    $('navTitle').textContent = '生肖翻牌 · ' + level.name;

    var board = $('board');
    board.innerHTML = '';

    S.cards = G.buildDeck(key);

    S.cards.forEach(function (card, index) {
      var el = document.createElement('div');
      el.className = 'card';
      el.setAttribute('data-index', String(index));
      el.innerHTML =
        '<div class="card-inner">' +
        '<div class="face face-back"><span class="back-mark">✦</span></div>' +
        '<div class="face face-front"><span class="face-emoji">' + card.face + '</span>' +
        '<span class="face-name">' + card.name + '</span></div>' +
        '</div>';
      card.el = el;
      board.appendChild(el);
    });

    updateHud();
    layoutBoard();
  }

  function startTimer() {
    S.started = true;
    S.startAt = Date.now();
    S.elapsed = 0;
    stopTimer();
    S.timer = setInterval(function () {
      if (!S.started) return;
      $('timeText').textContent = G.formatTime(S.elapsed + (Date.now() - S.startAt));
    }, 300);
  }

  function finish() {
    var elapsed = S.elapsed + (Date.now() - S.startAt);
    stopTimer();
    S.started = false;
    S.finished = true;

    var prev = readBest(S.level);
    var record = { moves: S.moves, time: elapsed };
    var isNewBest = G.isBetterRecord(prev, record);
    if (isNewBest) writeBest(S.level, record);

    $('timeText').textContent = G.formatTime(elapsed);
    updateFooter();
    $('resultEmoji').textContent = isNewBest ? '🎉' : '🧠';
    $('resultTitle').textContent = isNewBest ? '新纪录！' : '通关啦';
    $('resultSub').textContent = G.LEVELS[S.level].name + '难度 · 全部配对完成';
    $('resultMoves').textContent = S.moves;
    $('resultTime').textContent = G.formatTime(elapsed);
    $('resultBest').textContent = '最佳纪录 ' + G.formatRecord(isNewBest ? record : prev);
    $('resultMask').classList.add('is-show');
  }

  function flip(index) {
    if (S.locked || S.finished) return;
    var card = S.cards[index];
    if (!card || card.flipped) return;

    if (!S.started) startTimer();

    card.flipped = true;
    card.el.classList.add('is-flipped');

    if (S.first < 0) {
      S.first = index;
      return;
    }

    var firstIndex = S.first;
    var first = S.cards[firstIndex];
    S.first = -1;
    S.moves += 1;

    if (first.pairId === card.pairId) {
      card.matched = true;
      first.matched = true;
      card.el.classList.add('is-matched');
      first.el.classList.add('is-matched');
      S.matched += 1;
      updateHud();
      if (S.matched === S.cards.length / 2) finish();
      return;
    }

    S.locked = true;
    updateHud();
    card.el.classList.add('is-wrong');
    first.el.classList.add('is-wrong');

    setTimeout(function () {
      card.el.classList.remove('is-flipped', 'is-wrong');
      first.el.classList.remove('is-flipped', 'is-wrong');
      card.flipped = false;
      first.flipped = false;
      S.locked = false;
    }, 780);
  }

  /* ---------------- 截图用状态 ---------------- */

  function demoMid() {
    S.cards.forEach(function (card) {
      if (card.pairId === 0 || card.pairId === 1) {
        card.matched = true;
        card.flipped = true;
        card.el.classList.add('is-flipped', 'is-matched');
      }
    });
    var single = S.cards.filter(function (c) {
      return c.pairId === 2;
    })[0];
    if (single) {
      single.flipped = true;
      single.el.classList.add('is-flipped');
    }
    S.matched = 2;
    S.moves = 7;
    S.elapsed = 42000;
    $('moves').textContent = '7';
    $('pairs').textContent = '2/8';
    $('timeText').textContent = '00:42';
    updateFooter();
  }

  function demoResult() {
    S.cards.forEach(function (card) {
      card.matched = true;
      card.flipped = true;
      card.el.classList.add('is-flipped', 'is-matched');
    });
    S.matched = S.cards.length / 2;
    S.moves = 16;
    S.finished = true;
    $('moves').textContent = '16';
    $('pairs').textContent = S.matched + '/' + S.matched;
    $('timeText').textContent = '01:02';
    updateFooter();
    $('resultEmoji').textContent = '🎉';
    $('resultTitle').textContent = '新纪录！';
    $('resultSub').textContent = '标准难度 · 全部配对完成';
    $('resultMoves').textContent = '16';
    $('resultTime').textContent = '01:02';
    $('resultBest').textContent = '最佳纪录 16 步 · 01:02';
    $('resultMask').classList.add('is-show');
  }

  /* ---------------- 背景音乐（预览版） ---------------- */

  var SOUND_KEY = 'preview_sound';
  var bgm = $('bgm');

  function soundEnabled() {
    try {
      var value = window.localStorage.getItem(SOUND_KEY);
      return value === null ? true : value === '1';
    } catch (e) {
      return true;
    }
  }

  function applySound(on) {
    ['soundIndex', 'soundGame'].forEach(function (id) {
      var el = $(id);
      if (el) el.classList.toggle('is-off', !on);
    });
  }

  function playBgm() {
    if (!soundEnabled() || !bgm) return;
    bgm.volume = 0.45;
    var promise = bgm.play();
    if (promise && promise.catch) promise.catch(function () {});
  }

  function toggleSound() {
    var on = !soundEnabled();
    try {
      window.localStorage.setItem(SOUND_KEY, on ? '1' : '0');
    } catch (e) {
      /* ignore */
    }
    applySound(on);
    if (on) playBgm();
    else if (bgm) bgm.pause();
  }

  /* ---------------- 启动 ---------------- */

  renderLevels();
  renderZodiac();
  applySound(soundEnabled());

  document.getElementById('screen-index').classList.toggle('active', screen === 'index');
  document.getElementById('screen-game').classList.toggle('active', screen !== 'index');
  currentScreen = screen === 'index' ? 'index' : 'game';

  if (screen !== 'index') {
    startGame(levelKey);
    if (mode === 'mid') demoMid();
    if (mode === 'result') demoResult();
  }

  $('board').addEventListener('click', function (event) {
    var el = event.target.closest ? event.target.closest('.card') : null;
    if (!el) return;
    flip(Number(el.getAttribute('data-index')));
  });

  $('restart').addEventListener('click', function () {
    startGame(S.level);
  });

  $('btnAgain').addEventListener('click', function () {
    startGame(S.level);
  });

  $('btnBack').addEventListener('click', function () {
    showScreen('index');
  });

  $('navBack').addEventListener('click', function () {
    showScreen('index');
  });

  window.addEventListener('resize', function () {
    if (currentScreen === 'game') layoutBoard();
  });

  ['soundIndex', 'soundGame'].forEach(function (id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener('click', function (event) {
      event.stopPropagation();
      toggleSound();
    });
  });

  // 浏览器不允许自动播放，首次点击后再起音乐
  document.addEventListener('click', function () {
    if (bgm && bgm.paused) playBgm();
  });

  /* 调试：?s=game-mid#debug 会把布局尺寸写进 DOM，方便 --dump-dom 检查 */
  if (window.location.hash === '#debug') {
    setTimeout(function () {
      var board = document.querySelector('.board');
      var card = document.querySelector('.card');
      var page = document.querySelector('.page');
      var cs = window.getComputedStyle(board);
      var info = {
        innerWidth: window.innerWidth,
        dpr: window.devicePixelRatio,
        pageW: page.getBoundingClientRect().width,
        boardW: board.getBoundingClientRect().width,
        boardLeft: board.getBoundingClientRect().left,
        cardW: card ? card.getBoundingClientRect().width : null,
        cardH: card ? card.getBoundingClientRect().height : null,
        cols: cs.gridTemplateColumns,
        gap: cs.gap,
        display: cs.display
      };
      var pre = document.createElement('pre');
      pre.id = 'debug-out';
      pre.textContent = JSON.stringify(info, null, 2);
      pre.style.cssText =
        'position:fixed;left:0;top:0;z-index:999;margin:0;padding:10px;width:100%;' +
        'background:#000;color:#0f0;font:14px/1.5 monospace;white-space:pre-wrap;';
      document.body.appendChild(pre);
    }, 60);
  }
})();

</script>
</body>
</html>
